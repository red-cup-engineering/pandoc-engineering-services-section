name: Native Pandoc Engine tests

on:
  pull_request:
    paths:
      - 'apps/pandoc-engine/**'
      - '.github/workflows/native-pandoc.yml'
  push:
    branches: [main]
    paths:
      - 'apps/pandoc-engine/**'
      - '.github/workflows/native-pandoc.yml'

permissions:
  contents: read

jobs:
  engine:
    runs-on: [self-hosted, bare-cedar-fog]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.2.0'
      - uses: red-cup-engineering/lagoon/.github/actions/install-packages@2ef57212f6765c778563cf36a769443595fd215f
        with:
          supplier-ref: 2ef57212f6765c778563cf36a769443595fd215f
          working-directory: ${{ github.workspace }}/apps/pandoc-engine
          machine-registry: 'true'
          package-manager: npm
          arguments: '["install","--ignore-scripts","--no-audit","--no-fund"]'
      - name: Require Pandoc and verify real receipts
        working-directory: apps/pandoc-engine
        run: |
          pandoc --version
          bash -n bin/publish-book
          npm test
